<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hyperstudio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Cool slate dark palette */
    --bg-0: #0a0e1a;        /* outermost (letterbox + body) */
    --bg-1: #0f1525;        /* primary panel surface */
    --bg-2: #161d31;        /* elevated card / hover */
    --bg-3: #1e2742;        /* nested card / clip */
    --bg-player: #05080f;   /* video area */
    --line-1: rgba(148,163,184,0.10);
    --line-2: rgba(148,163,184,0.18);
    --line-3: rgba(148,163,184,0.28);

    --fg-1: #f1f5fd;
    --fg-2: #cbd5e1;
    --fg-3: #94a3b8;
    --fg-4: #64748b;
    --fg-5: #475569;

    --accent: #f97316;
    --accent-2: #fb923c;
    --accent-soft: rgba(249,115,22,0.12);
    --accent-line: rgba(249,115,22,0.40);
    --accent-ink: #fed7aa;

    --amber: #f5c247;       /* captions */
    --amber-soft: rgba(245,194,71,0.14);
    --green: #4ade80;       /* audio waveforms */
    --green-soft: rgba(74,222,128,0.14);
    --violet: #a78bfa;      /* b-roll */
    --violet-soft: rgba(167,139,250,0.14);
    --red: #ef4444;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-2: 0 4px 12px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.25);
    --shadow-3: 0 18px 40px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);

    --t-fast: 120ms cubic-bezier(.2,.7,.3,1);
    --t-med: 240ms cubic-bezier(.2,.7,.3,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0);
    color: var(--fg-1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

  /* utility */
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum' 1; }
  .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* pulse for "Claude is touching this" */
  @keyframes hs-pulse-clip {
    0%, 100% { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
    50%      { box-shadow: 0 0 0 1px var(--accent-2), 0 0 0 8px transparent; }
  }
  .pulse-clip { animation: hs-pulse-clip 1.6s ease-in-out infinite; }

  @keyframes hs-spin { to { transform: rotate(360deg); } }
  .spin { animation: hs-spin 1s linear infinite; }

  @keyframes hs-typing-dot {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  .typing-dot { animation: hs-typing-dot 1.4s infinite; }

  /* focus ring */
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hs-icons.jsx"></script>
<script type="text/babel" src="hs-data.jsx"></script>
<script type="text/babel" src="hs-chat.jsx"></script>
<script type="text/babel" src="hs-libraries.jsx"></script>
<script type="text/babel" src="hs-player-timeline.jsx"></script>
<script type="text/babel" src="hs-states.jsx"></script>
<script type="text/babel" src="hs-app.jsx"></script>
</body>
</html>
